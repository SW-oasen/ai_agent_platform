openapi: 3.1.0
info:
  title: AI Memory and Context API
  version: 0.3.0
  description: Local user-scoped memory and context boundary; document-RAG data is excluded.
servers:
  - url: http://127.0.0.1:8205
paths:
  /v1/context/build:
    post: {description: Build context for one validated user and session.}
  /v1/context/turns:
    post: {description: Record one completed user/assistant turn.}
  /v1/memories:
    get: {description: List memories for one user.}
    post: {description: Create an explicit memory entry.}
    delete: {description: Clear all memory and session turns for one user.}
  /v1/memories/{memory_id}:
    delete: {description: Delete one user-scoped memory entry.}
  /v1/sessions:
    get: {description: List compact user-scoped conversation sessions.}
  /v1/sessions/{session_id}:
    delete: {description: Delete all turns in one user-scoped session.}
  /v1/sessions/{session_id}/turns:
    get: {description: List complete user/assistant turns in one session.}
  /v1/sessions/{session_id}/turns/{turn_id}:
    delete: {description: Delete a complete user/assistant turn.}
