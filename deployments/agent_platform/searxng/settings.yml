# Local-only SearXNG instance. SEARXNG_SECRET overrides this placeholder at runtime.
use_default_settings: true

general:
  instance_name: "AI Agent Platform local search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  secret_key: "runtime-secret-required"
  limiter: false
  image_proxy: false

valkey:
  url: false
